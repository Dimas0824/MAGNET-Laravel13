services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time; the browser connects from
        # the host, so it reaches Reverb on the published localhost:8080.
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-magnet-key}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    image: ${IMAGE_TAG:-magnet-app:local}
    container_name: magnet_app
    restart: unless-stopped
    ports:
      - "8001:80"
    environment:
      APP_NAME: MAGNET
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=}
      APP_URL: ${APP_URL:-http://localhost:8001}
      SERVER_NAME: :80
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${CONTAINER_DB_DATABASE:-db_magnet}
      DB_USERNAME: ${CONTAINER_DB_USERNAME:-magnet}
      DB_PASSWORD: ${CONTAINER_DB_PASSWORD:-magnet123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-magnet}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-magnet-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-magnet-secret}
      REVERB_HOST: ${REVERB_SERVER_TARGET:-reverb}
      REVERB_PORT: ${REVERB_SERVER_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      PERF_LOG_ENABLED: "true"
      PERF_LOG_SAMPLE_RATE: "100"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage

  worker:
    image: ${IMAGE_TAG:-magnet-app:local}
    container_name: magnet_worker
    restart: unless-stopped
    environment:
      APP_NAME: MAGNET
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=}
      APP_URL: ${APP_URL:-http://localhost:8001}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${CONTAINER_DB_DATABASE:-db_magnet}
      DB_USERNAME: ${CONTAINER_DB_USERNAME:-magnet}
      DB_PASSWORD: ${CONTAINER_DB_PASSWORD:-magnet123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: file
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-magnet}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-magnet-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-magnet-secret}
      REVERB_HOST: ${REVERB_SERVER_TARGET:-reverb}
      REVERB_PORT: ${REVERB_SERVER_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      SKIP_OPTIMIZE: "true"
    command: ["php", "artisan", "queue:work", "--queue=default", "--tries=3", "--timeout=120", "--sleep=3"]
    # The image ships an HTTP healthcheck (/up) intended for the web server;
    # the worker runs no HTTP server, so disable it. Liveness is covered by
    # restart: unless-stopped (queue:work exiting restarts the container).
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage

  # One-shot: run migrations + optional seed, then exit.
  migrate:
    image: ${IMAGE_TAG:-magnet-app:local}
    container_name: magnet_migrate
    profiles: ["setup"]
    environment:
      APP_NAME: MAGNET
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${CONTAINER_DB_DATABASE:-db_magnet}
      DB_USERNAME: ${CONTAINER_DB_USERNAME:-magnet}
      DB_PASSWORD: ${CONTAINER_DB_PASSWORD:-magnet123}
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage

  reverb:
    image: ${IMAGE_TAG:-magnet-app:local}
    container_name: magnet_reverb
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: MAGNET
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-base64:2fl+Ktvkfl+Fuz4Qp/A75G2RTiWVA/ZoKZvp6fiiM10=}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${CONTAINER_DB_DATABASE:-db_magnet}
      DB_USERNAME: ${CONTAINER_DB_USERNAME:-magnet}
      DB_PASSWORD: ${CONTAINER_DB_PASSWORD:-magnet123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-magnet}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-magnet-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-magnet-secret}
      REVERB_HOST: ${REVERB_SERVER_TARGET:-reverb}
      REVERB_PORT: ${REVERB_SERVER_PORT:-8080}
      REVERB_SCHEME: ${REVERB_SCHEME:-http}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      SKIP_OPTIMIZE: "true"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/storage

  redis:
    image: redis:7-alpine
    container_name: magnet_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  db:
    image: mysql:8.0
    container_name: magnet_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${CONTAINER_DB_DATABASE:-db_magnet}
      MYSQL_USER: ${CONTAINER_DB_USERNAME:-magnet}
      MYSQL_PASSWORD: ${CONTAINER_DB_PASSWORD:-magnet123}
      MYSQL_ROOT_PASSWORD: ${CONTAINER_DB_ROOT_PASSWORD:-root123}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${CONTAINER_DB_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  app_storage:
  redis_data:
  db_data:
